title: "arXiv Harvester - Báo cáo kỹ thuật M1 & M2"
author: "Nhóm arXiv Harvester (ĐHKHTN, ĐHQG-HCM)"
copyright: "2026 - Nhóm arXiv Harvester, Nhập môn Khoa học Dữ liệu"

only_build_toc_files: true
exclude_patterns:
  - _build
  - README.md
  - "**.ipynb_checkpoints"
  - .jupyter_cache

repository:
  url: https://github.com/NguyenQuocDat06-AI/arxiv-harvester-book
  branch: main

html:
  home_page_in_navbar: true
  use_repository_button: true
  use_issues_button: true
  use_edit_page_button: false
  use_multitoc_numbering: false
  baseurl: https://nguyenquocdat06-ai.github.io/arxiv-harvester-book/
  extra_footer: |
    <div class="ah-footer-note">
      Quy mô: 25.000 bài báo (41.498 phiên bản) trên Google Colab CPU-only |
      Mã nguồn: <a href="https://github.com/NguyenQuocDat06-AI/arxiv-harvester" target="_blank" rel="noopener">arxiv-harvester</a> |
      Dữ liệu: <a href="https://huggingface.co/datasets/nquocdat06/arxiv-harvester-data" target="_blank" rel="noopener">Hugging Face (3,92 GiB)</a>
    </div>

parse:
  myst_enable_extensions:
    - colon_fence
    - dollarmath
    - amsmath
    - deflist
    - attrs_inline
    - attrs_block
    - substitution
    - tasklist

execute:
  execute_notebooks: force
  allow_errors: false
  timeout: 600

sphinx:
  recursive_update: true
  config:
    language: vi
    nb_execution_raise_on_error: true
    html_theme_options:
      use_source_button: true
      use_download_button: true
      use_fullscreen_button: true
      show_navbar_depth: 2
      collapse_navbar: false
      toc_title: "Mục lục trang"
      search_bar_text: "Tìm kiếm nội dung..."
      icon_links:
        - name: "Mã nguồn hệ thống (GitHub)"
          url: "https://github.com/NguyenQuocDat06-AI/arxiv-harvester"
          icon: "fa-brands fa-github"
          type: "fontawesome"
        - name: "Bộ dữ liệu Hugging Face"
          url: "https://huggingface.co/datasets/nquocdat06/arxiv-harvester-data"
          icon: "fa-solid fa-database"
          type: "fontawesome"
